<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>contact confirmation</title>
    <style>
      .container {
        padding: 20px;
        max-width: 520px;
        margin: auto;
      }
      .bg-red {
        background-color: #0f172a;
        padding: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .img-wrapper {
        width: 300px;
      }
      img {
        width: 100%;
        height: auto;
      }

      .content p {
        font-family: Helvetica;
        font-weight: 300;
        font-size: 1.2rem;
      }
      footer {
        background-color: #333;
        color: white;
      }
      footer div {
      }
      .span1 {
        font-weight: 500;
        font-size: 20px;
      }
      .span2 {
        display: inline-block;
        padding-left: 10px;
        font-size: 30px;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

  <body>
    <div class="container">
      <div class="bg-red">
        <div class="img-wrapper">
          <img src="https://c2constructionsecurityservices.co.uk/_nuxt/C2.3wrokQvX.png" alt="brand logo" />
        </div>
      </div>
      <div class="content">
        <p>Hey, a client has contacted you via the <strong>contact us</strong> portal. Here are their details:</p>
        <table style="width:100%;border-collapse:collapse;font-family:Helvetica;font-size:1rem;">
          <tr style="border-bottom:1px solid #eee;">
            <td style="padding:8px;font-weight:600;width:35%;">First Name</td>
            <td style="padding:8px;">{{ first_name }}</td>
          </tr>
          <tr style="border-bottom:1px solid #eee;">
            <td style="padding:8px;font-weight:600;">Last Name</td>
            <td style="padding:8px;">{{ last_name }}</td>
          </tr>
          <tr style="border-bottom:1px solid #eee;">
            <td style="padding:8px;font-weight:600;">Email</td>
            <td style="padding:8px;">{{ email }}</td>
          </tr>
          <tr style="border-bottom:1px solid #eee;">
            <td style="padding:8px;font-weight:600;">Phone</td>
            <td style="padding:8px;">{{ phone }}</td>
          </tr>
          <tr>
            <td style="padding:8px;font-weight:600;vertical-align:top;">Message</td>
            <td style="padding:8px;">{{ info }}</td>
          </tr>
        </table>
      </div>
    </div>

    <footer>
      <div class="container">
        <span class="span1"> Follow us on social: </span>
        <a
          href="https://x.com/c2construc26800?s=20"
          rel="noreferrer noopener"
          target="_blank"
        >
          <span class="span2">
            <i class="ri-twitter-x-fill"></i>
          </span>
        </a>
        <a href="https://x.com/c2construc26800?s=20" title="Twitter"
                                                               target="_blank"

      </div>
